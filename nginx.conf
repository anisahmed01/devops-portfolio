# ==============================================================================
# Nginx Hardened Configuration for Anis Ahmed DevOps Portfolio
# Unprivileged execution on port 8080 with high-performance caching & security
# ==============================================================================

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name anisahmed.in www.anisahmed.in localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Security Headers (OWASP Recommended)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Cache Control for Static Assets (Images, WebP, Fonts, Icons)
    location ~* \.(?:jpg|jpeg|png|webp|ico|svg|woff2?|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # Cache Control for Stylesheets and Scripts
    location ~* \.(?:css|js)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # HTML and XML (Sitemap, Robots) - Fast Revalidation
    location ~* \.(?:html|xml|txt)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Health Check Endpoint
    location /healthz {
        access_log off;
        return 200 "OK\n";
    }

    # SPA / Clean URL Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny Hidden Files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

