name: CI/CD Pipeline - Deploy to anisahmed.in

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------
  # STAGE 1: Code Quality, Lint & Security Audit
  # -----------------------------------------------------------
  audit-and-validate:
    name: Code Quality & Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: HTML5 / JavaScript Syntax Validation
        run: |
          echo "Running static analysis and link validation..."
          test -f index.html || exit 1
          test -f styles.css || exit 1
          test -f app.js || exit 1
          echo "All core assets verified successfully."

      - name: Scan for Exposed Secrets & API Keys
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          extra_args: --only-verified

  # -----------------------------------------------------------
  # STAGE 2: Automated Deployment to Hostinger via FTP
  # -----------------------------------------------------------
  deploy-to-hostinger:
    name: Deploy to anisahmed.in (Hostinger)
    needs: [audit-and-validate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST || secrets.HOSTINGER_FTP_SERVER || secrets.FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USER || secrets.HOSTINGER_FTP_USERNAME || secrets.FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD || secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          server-dir: ./
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/k8s/**
            **/terraform/**
            **/Dockerfile
            **/README.md
            **/.github/**

      - name: Deployment Health Check Verification
        run: |
          echo "Verifying HTTP response from production domain..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://anisahmed.in || echo "000")
          echo "HTTP Status Code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 301 ]; then
            echo "Deployment verified healthy on https://anisahmed.in!"
          else
            echo "Warning: Received status $HTTP_STATUS, propagation may be in progress."
          fi