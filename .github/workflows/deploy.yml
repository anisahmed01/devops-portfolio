name: CI/CD Pipeline - DevOps Platform & Production Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------
  # STAGE 1: Code Quality, Asset Verification & Security Audit
  # -----------------------------------------------------------
  audit-and-validate:
    name: Code Quality & Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Static Asset & File Integrity Verification
        run: |
          echo "Verifying web assets and SEO configuration..."
          test -f index.html || (echo "Missing index.html" && exit 1)
          test -f styles.css || (echo "Missing styles.css" && exit 1)
          test -f app.js || (echo "Missing app.js" && exit 1)
          test -f robots.txt || (echo "Missing robots.txt" && exit 1)
          test -f sitemap.xml || (echo "Missing sitemap.xml" && exit 1)
          test -f nginx.conf || (echo "Missing nginx.conf" && exit 1)
          echo "All core assets and configurations verified successfully."

      - name: Scan for Exposed Secrets & API Keys
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          extra_args: --only-verified

  # -----------------------------------------------------------
  # STAGE 2: Infrastructure as Code & Container Validation (CI)
  # -----------------------------------------------------------
  validate-infra-and-container:
    name: IaC & Container Validation (K8s / Terraform / Docker)
    runs-on: ubuntu-latest
    needs: [audit-and-validate]
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Validate Terraform Architecture
        run: |
          echo "Initializing and validating Terraform modules..."
          cd terraform
          terraform fmt -check
          terraform init -backend=false
          terraform validate
          echo "Terraform configuration is valid."

      - name: Validate Kubernetes Manifests
        run: |
          echo "Validating Kubernetes manifests syntax..."
          kubectl apply --dry-run=client --validate=false -f k8s/
          echo "Kubernetes manifests are syntactically valid."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Hardened Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ghcr.io/anisahmed01/portfolio:latest

  # -----------------------------------------------------------
  # STAGE 3: Automated Deployment to Production (Hostinger)
  # -----------------------------------------------------------
  deploy-to-hostinger:
    name: Deploy to anisahmed.in (Production Edge)
    needs: [validate-infra-and-container]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Deploy to Hostinger via Secure FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST || secrets.HOSTINGER_FTP_SERVER || secrets.FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USER || secrets.HOSTINGER_FTP_USERNAME || secrets.FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD || secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          server-dir: ./
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/k8s/**
            **/terraform/**
            **/Dockerfile
            **/nginx.conf
            **/README.md
            **/.github/**

      - name: Production Deployment Health Check
        run: |
          echo "Verifying HTTP response from https://anisahmed.in..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://anisahmed.in || echo "000")
          echo "HTTP Status Code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 301 ]; then
            echo "Production deployment healthy on https://anisahmed.in!"
          else
            echo "Warning: Received status $HTTP_STATUS, propagation may be in progress."
          fi
