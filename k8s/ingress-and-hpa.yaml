apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-web-ingress
  namespace: production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Clacks-Overhead: GNU Terry Pratchett";
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - anisahmed.in
        - www.anisahmed.in
      secretName: anisahmed-in-tls
  rules:
    - host: anisahmed.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio-web-svc
                port:
                  number: 80
    - host: www.anisahmed.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio-web-svc
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: portfolio-web-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: portfolio-web
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
